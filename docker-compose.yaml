services:
  app:
    build:
      context: .
      dockerfile: Dockerfile

    image: management-tools:latest
    container_name: management-tools
    restart: unless-stopped

    ports:
      - "3001:3000"

    environment:
      NODE_ENV: production
      PORT: "3000"

    volumes:
      - /mnt/docker-data/appdata/management-tools/data:/app/data
      - /mnt/docker-data/appdata/management-tools/backups:/app/backups

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
